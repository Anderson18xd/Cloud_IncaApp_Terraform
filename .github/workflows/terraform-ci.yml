name: CI Terraform Pro (TFLint + Trivy + OIDC)

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  ci-dev:
    name: Calidad, Seguridad y Plan (dev)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo
        uses: actions/checkout@v4

      - name: 2. Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. Revisar formato (fmt)
        run: terraform fmt -check -recursive

      - name: 4. Instalar y correr TFLint (buenas practicas)
        uses: terraform-linters/setup-tflint@v4
      - name: Ejecutar TFLint en todo el repo
        run: |
          tflint --init
          tflint --recursive

      - name: 5. Escaneo de seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          
      - name: 6. Autenticar contra AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102798329073:role/github-actions-incaapp-role
          aws-region: us-east-1

      - name: 7. Init, Validate y Plan en dev
        working-directory: envs/dev
        run: |
          terraform init
          terraform validate
          terraform plan -no-color