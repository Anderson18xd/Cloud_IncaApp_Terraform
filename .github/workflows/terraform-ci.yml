name: CI Terraform con OIDC

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

# OBLIGATORIO para que GitHub pueda generar el token temporal OIDC
permissions:
  id-token: write
  contents: read

jobs:
  plan-dev:
    name: Validar y Plan (dev)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo
        uses: actions/checkout@v4

      - name: 2. Autenticar contra AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102798329073:role/github-actions-incaapp-role
          aws-region: us-east-1

      - name: 3. Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 4. Revisar formato
        run: terraform fmt -check -recursive

      - name: 5. Init, Validate y Plan en dev
        working-directory: envs/dev
        run: |
          terraform init
          terraform validate
          terraform plan -no-color